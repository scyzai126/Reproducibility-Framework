services:
  mysql:
    image: mysql:8.0
    container_name: claimrepro_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: immport_dr62
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: claimrepro_api
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/immport_dr62
    volumes:
      - ./apps/api/claims:/service/claims
      - ./apps/api/logs:/service/logs
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: claimrepro_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_BACKEND_ORIGIN: http://api:8000

  nginx:
    image: nginx:alpine
    container_name: claimrepro_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  mysql_data:
